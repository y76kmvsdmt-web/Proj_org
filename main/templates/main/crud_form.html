{% extends 'main/base.html' %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="crud-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Сохранить</button>
    <a href="{{ view.success_url }}" class="btn btn-gray">Отмена</a>
</form>
{% endblock %}
